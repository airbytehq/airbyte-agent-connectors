          type: string
          description: Conversion rule name
        type:
          type: string
          description: "Conversion category, e.g. LEAD, PURCHASE, SIGN_UP, DOWNLOAD, ADD_TO_CART, INSTALL, KEY_PAGE_VIEW, OTHER"
        attributionType:
          type: string
          description: How conversions are attributed to campaigns
          enum: [LAST_TOUCH_BY_CAMPAIGN, LAST_TOUCH_BY_CONVERSION]
        postClickAttributionWindowSize:
          type: integer
          description: Post-click attribution window in days (1, 7, 30, or 90)
        viewThroughAttributionWindowSize:
          type: integer
          description: View-through attribution window in days (1, 7, or 30)
        enabled:
          type: boolean
          description: Whether the rule is active
        urlMatchRuleExpression:
          type: array
          description: URL match rules for page-based conversion tracking
          items:
            type: array
            items:
              type: object
              additionalProperties: true
        value:
          type: object
          description: Monetary value assigned to each conversion
          properties:
            amount:
              type: string
            currencyCode:
              type: string
      additionalProperties: true

    ConversionEventsBatchRequest:
      type: object
      description: Batch of offline conversion events (Rest.li BATCH_CREATE, max 5,000 per request)
      required:
      - elements
      properties:
        elements:
          type: array
          maxItems: 5000
          description: Conversion events to ingest
          items:
            type: object
            required:
            - conversion
            - conversionHappenedAt
            properties:
              conversion:
                type: string
                description: "Conversion rule URN, e.g. urn:lla:llaPartnerConversion:123456"
              conversionHappenedAt:
                type: integer
                description: Epoch milliseconds when the conversion occurred
              user:
                type: object
                description: Identifies the converting user (hashed email or other supported ID types)
                properties:
                  userIds:
                    type: array
                    items:
                      type: object
                      properties:
                        idType:
                          type: string
                          description: "e.g. SHA256_EMAIL, LINKEDIN_FIRST_PARTY_ADS_TRACKING_UUID"
                        idValue:
                          type: string
                  userInfo:
                    type: object
                    additionalProperties: true
              conversionValue:
                type: object
                description: Monetary value of this conversion
                properties:
                  amount:
                    type: string
                  currencyCode:
                    type: string
              eventId:
                type: string
                description: Optional unique event ID for deduplication
            additionalProperties: true

    CampaignConversionUpsertRequest:
      type: object
      description: Campaign-to-conversion association record; may be empty since the key carries both URNs
      properties:
        campaign:
          type: string
          description: "Campaign URN, e.g. urn:li:sponsoredCampaign:123456"
        conversion:
          type: string
          description: "Conversion rule URN, e.g. urn:lla:llaPartnerConversion:123456"
      additionalProperties: true

      - name: X-RestLi-Method
        in: header
        required: true
        description: Required by LinkedIn for hard-deleting creatives
        schema:
          type: string
          default: DELETE
      responses:
        "204":
          description: Creative deleted
        "400":
          description: Creative is not draft-deletable; soft-delete via update instead
        "401":
          description: Unauthorized
        "403":
          description: Insufficient scope or ad-account role
        "404":

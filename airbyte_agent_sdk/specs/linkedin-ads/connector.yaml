    RestliCreateResponse:
      type: object
      description: >
        Rest.li create responses have an empty JSON body; the created entity ID or URN
        is returned in the x-restli-id response header (surfaced via the operation's
        meta extractor as created_id).
      additionalProperties: true

    RestliPartialUpdateRequest:
      type: object
      description: >
        Rest.li partial update envelope shared by all LinkedIn Ads update operations.
        Wrap the fields to change in patch.$set. Setting an array field replaces the
        entire array, so include all existing elements you want to keep.
      required:
      - patch
      properties:
        patch:
          type: object
          required:
          - "$set"
          properties:
            "$set":
              type: object
              description: Map of field names to their new values
              additionalProperties: true

    CampaignCreateRequest:
      type: object
      description: Fields for creating a campaign
      required:
      - account
      - name
      - runSchedule
      - offsiteDeliveryEnabled
      - politicalIntent
      properties:
        account:
          type: string
          description: "Sponsored account URN; must match the account_id path parameter, e.g. urn:li:sponsoredAccount:123456"
        name:
          type: string
          description: Campaign name
        politicalIntent:
          type: string
          description: Whether the campaign contains political content; LinkedIn requires this on create
          enum: [NOT_POLITICAL, POLITICAL]
        campaignGroup:
          type: string
          description: "Campaign group URN, e.g. urn:li:sponsoredCampaignGroup:123456"
        type:
          type: string
          description: Campaign format
          enum: [TEXT_AD, SPONSORED_UPDATES, SPONSORED_INMAILS, DYNAMIC]
        objectiveType:
          type: string
          description: "Campaign objective, e.g. BRAND_AWARENESS, WEBSITE_VISIT, LEAD_GENERATION, WEBSITE_CONVERSION, VIDEO_VIEW, ENGAGEMENT, JOB_APPLICANT"
        status:
          type: string
          description: Initial campaign status
          enum: [ACTIVE, PAUSED, DRAFT]
        costType:
          type: string
          description: "Bidding cost type, e.g. CPM, CPC, CPV"
        dailyBudget:
          type: object
          description: Daily budget
          properties:
            amount:
              type: string
            currencyCode:
              type: string
        unitCost:
          type: object
          description: Bid amount per unit (per click, per impression, etc.)
          properties:
            amount:
              type: string
            currencyCode:
              type: string
        locale:
          type: object
          description: Campaign locale
          properties:
            country:
              type: string
            language:
              type: string
        runSchedule:
          type: object
          description: Scheduled run window (epoch milliseconds)
          properties:
            start:
              type: integer
            end:
              type: integer
        targetingCriteria:
          type: object
          description: Audience targeting criteria (include/exclude clauses)
        audienceExpansionEnabled:
          type: boolean
          description: Whether audience expansion is enabled
        offsiteDeliveryEnabled:
          type: boolean
          description: Whether ads may be served on the LinkedIn Audience Network
        creativeSelection:
          type: string
          description: "Creative rotation strategy, e.g. ROUND_ROBIN, OPTIMIZED"
      additionalProperties: true

    CampaignGroupCreateRequest:
      type: object
      description: Fields for creating a campaign group
      required:

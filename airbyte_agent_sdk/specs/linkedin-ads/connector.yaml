servers:
- url: https://api.linkedin.com/rest
  description: LinkedIn Marketing API server

security:
- oauth2: []
- bearerAuth: []

paths:
  /adAccounts:
    get:
      summary: List ad accounts
      description: Returns a list of ad accounts the authenticated user has access to
      operationId: listAccounts
      x-airbyte-entity: accounts
      x-airbyte-action: list
      x-airbyte-preferred-for-check: true
      x-airbyte-record-extractor: $.elements
      x-airbyte-record-transform:
        account_urn: "urn:li:sponsoredAccount:{{ record.id }}"
        owner_param: "(sponsoredAccount:urn:li:sponsoredAccount:{{ record.id }})"
      x-airbyte-meta-extractor:
        nextPageToken: $.metadata.nextPageToken
      parameters:
      - name: q
        in: query
        required: true
        description: "LinkedIn API finder method for querying ad accounts"
        schema:
          type: string
          default: search
      - name: pageSize
        in: query
        description: Number of items per page
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: pageToken
        in: query
        description: Token for the next page of results
        schema:
          type: string
      - name: LinkedIn-Version
        in: header
        required: true
        schema:
          type: string
          default: "202606"
      responses:
        "200":
          description: List of ad accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountsList"
        "401":
          description: Unauthorized

    post:
      summary: Create an ad account
      description: >
        Creates a new ad account. Only type BUSINESS can be created via the API
        (ENTERPRISE accounts cannot). Requires the rw_ads OAuth scope. The new account
        ID is returned in the x-restli-id response header.
      operationId: createAccount
      x-airbyte-entity: accounts
      x-airbyte-action: create
      x-airbyte-untested: true
      x-airbyte-meta-extractor:
        created_id: "@header.x-restli-id"
      parameters:
      - name: LinkedIn-Version
        in: header
        required: true
        schema:
          type: string
          default: "202606"
      - name: X-Restli-Protocol-Version
        in: header
        required: true
        schema:
          type: string
          default: "2.0.0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreateRequest"
      responses:
        "201":
          description: Ad account created; new ID is in the x-restli-id response header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestliCreateResponse"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Insufficient scope

  /adAccounts/{id}:
    get:
      summary: Get an ad account
      description: Get a single ad account by ID
      operationId: getAccount
      x-airbyte-entity: accounts
      x-airbyte-action: get
      parameters:
      - name: id
        in: path
        required: true
        description: Ad account ID
        schema:
          type: integer
      - name: LinkedIn-Version
        in: header
        required: true
        schema:
          type: string
          default: "202606"
      responses:
        "200":

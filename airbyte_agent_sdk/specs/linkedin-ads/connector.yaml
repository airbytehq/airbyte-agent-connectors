        in: header
        required: true
        description: Rest.li method override; partial updates are POSTs with this header
        schema:
          type: string
          default: PARTIAL_UPDATE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestliPartialUpdateRequest"
      responses:
        "204":
          description: Creative updated
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "403":
          description: Insufficient scope or ad-account role
        "404":
          description: Creative not found

    delete:
      summary: Delete a creative
      description: >
        Hard-deletes a creative. Only creatives in DRAFT intendedStatus (or linked to a
        draft campaign, or with failed video uploads) accept a true DELETE; LinkedIn
        uniquely requires the X-RestLi-Method DELETE header on this call. For other
        creatives, soft-delete via the update operation by setting intendedStatus to
        PENDING_DELETION. Requires the rw_ads OAuth scope and a CREATIVE_MANAGER or
        higher ad-account role.
      operationId: deleteCreative
      x-airbyte-entity: creatives
      x-airbyte-action: delete
      x-airbyte-untested: true
      parameters:
      - name: account_id
        in: path
        required: true
        description: Ad account ID
        schema:
          type: integer
      - name: id
        in: path
        required: true
        description: "Creative URN, e.g. urn:li:sponsoredCreative:123456"
        schema:

      responses:
        "200":
          description: Creative object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Creative"
        "404":
          description: Creative not found
        "401":
          description: Unauthorized

    post:
      summary: Update a creative
      description: >
        Partially updates a creative using the Rest.li PARTIAL_UPDATE pattern: the body
        wraps the fields to change in patch.$set. Only a limited set of creative fields
        is mutable (e.g. intendedStatus, name, leadgenCallToAction). Requires the rw_ads
        OAuth scope and a CREATIVE_MANAGER or higher ad-account role. To soft-delete a
        non-draft creative, set intendedStatus to PENDING_DELETION here.
      operationId: updateCreative
      x-airbyte-entity: creatives
      x-airbyte-action: update
      x-airbyte-untested: true
      parameters:
      - name: account_id
        in: path
        required: true
        description: Ad account ID
        schema:
          type: integer
      - name: id
        in: path
        required: true
        description: "Creative URN, e.g. urn:li:sponsoredCreative:123456"
        schema:
          type: string
      - name: LinkedIn-Version
        in: header
        required: true
        schema:
          type: string
          default: "202606"
      - name: X-Restli-Protocol-Version
        in: header
        required: true
        schema:
          type: string

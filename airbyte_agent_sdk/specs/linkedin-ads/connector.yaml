      additionalProperties: true

    CreativeCreateRequest:
      type: object
      description: Fields for creating a creative
      required:
      - campaign
      properties:
        campaign:
          type: string
          description: "Campaign URN the creative belongs to, e.g. urn:li:sponsoredCampaign:123456"
        content:
          type: object
          description: >

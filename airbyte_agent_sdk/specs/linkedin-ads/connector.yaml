components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.0 authentication with refresh token
      flows:
        authorizationCode:
          authorizationUrl: https://www.linkedin.com/oauth/v2/authorization
          tokenUrl: https://www.linkedin.com/oauth/v2/accessToken
          refreshUrl: https://www.linkedin.com/oauth/v2/accessToken
          scopes:
            r_ads: Retrieve your advertising accounts
            r_ads_reporting: Retrieve reporting for your advertising accounts
            r_marketing_leadgen_automation: Access your lead generation forms and retrieve leads (including event leads, ad leads, and organization page leads)
            rw_ads: Manage your advertising accounts, campaigns, campaign groups, and creatives
            rw_conversions: Manage conversion rules, conversion events, and campaign conversion associations (requires separate LinkedIn partner approval)
      x-airbyte-oauth-scopes:
        - scope: "r_ads"
          mode: read
          entities:
            - accounts
            - account_users
            - campaigns
            - campaign_groups
            - creatives
            - conversions
        - scope: "r_ads_reporting"
          mode: read
          entities:
            - ad_campaign_analytics
            - ad_creative_analytics
            - ad_impression_device_analytics
            - ad_member_company_analytics
            - ad_member_company_size_analytics
            - ad_member_country_analytics
            - ad_member_industry_analytics
            - ad_member_job_function_analytics
            - ad_member_job_title_analytics
            - ad_member_region_analytics
            - ad_member_seniority_analytics
        - scope: "r_marketing_leadgen_automation"
          mode: read
          entities:
            - lead_forms
            - lead_form_responses
        - scope: "rw_ads"
          mode: write
          entities:
            - accounts
            - account_users
            - campaigns
            - campaign_groups
            - creatives
        - scope: "rw_conversions"
          mode: write
          entities:
            - conversions
            - conversion_events
            - campaign_conversions
      x-airbyte-token-refresh:
        auth_style: body
        body_format: form
      x-airbyte-auth-config:
        title: "OAuth 2.0 Authentication"
        type: object
        required:
        - refresh_token
        - client_id
        - client_secret
        properties:
          refresh_token:
            type: string
            title: "Refresh Token"
            description: "OAuth 2.0 refresh token for automatic renewal"
          client_id:
            type: string
            title: "Client ID"
            description: "OAuth 2.0 application client ID"
          client_secret:
            type: string
            title: "Client Secret"
            description: "OAuth 2.0 application client secret"
        auth_mapping:
          refresh_token: "${refresh_token}"
          client_id: "${client_id}"
          client_secret: "${client_secret}"
        replication_auth_key_mapping:
          credentials.client_id: "client_id"
          credentials.client_secret: "client_secret"
          credentials.refresh_token: "refresh_token"
        replication_auth_key_constants:
          credentials.auth_method: "oAuth2.0"

    bearerAuth:
      type: http
      scheme: bearer
      description: Direct access token authentication
      x-airbyte-auth-config:
        title: "Access Token Authentication"
        type: object
        required:
        - access_token
        properties:
          access_token:
            type: string
            title: "Access Token"
            description: "The access token generated for your developer application"
        auth_mapping:
          token: "${access_token}"
        replication_auth_key_mapping:
          credentials.access_token: "access_token"
        replication_auth_key_constants:
          credentials.auth_method: "access_token"

  schemas:
    Account:
      type: object
      x-airbyte-entity-name: accounts
      x-airbyte-stream-name: accounts
      x-airbyte-ai-hints:
        summary: "LinkedIn Ads accounts with status and billing information"
        when_to_use: "Questions about ad account details or account-level settings"
        trigger_phrases: ["linkedin ads account", "ad account"]
        freshness: live
        search_strategy: "List all accessible accounts"
        example_questions:
          - "What LinkedIn Ads accounts do I have?"
      description: LinkedIn ad account object
      properties:
        id:
          type:
          - "null"
          - integer
          description: Unique account identifier
        name:
          type:
          - "null"
          - string
          description: Account name
        currency:
          type:
          - "null"
          - string
          description: Currency code used by the account
        status:
          type:
          - "null"
          - string
          description: Account status (ACTIVE, PAUSED, etc.)
        type:
          type:
          - "null"
          - string
          description: Account type
        reference:
          type:
          - "null"
          - string
          description: Reference organization URN
        test:
          type:
          - "null"
          - boolean
          description: Whether this is a test account
        changeAuditStamps:
          type:
          - "null"
          - object
          description: Creation and last modification audit stamps
          properties:
            created:
              type:
              - "null"
              - object
              properties:
                actor:
                  type:
                  - "null"
                  - string
                time:
                  type:
                  - "null"
                  - integer
            lastModified:
              type:
              - "null"
              - object
              properties:
                actor:
                  type:
                  - "null"
                  - string
                time:
                  type:
                  - "null"
                  - integer
        notifiedOnCampaignOptimization:
          type:
          - "null"
          - boolean
          description: Notification flag for campaign optimization
        notifiedOnCreativeApproval:
          type:
          - "null"
          - boolean
          description: Notification flag for creative approval
        notifiedOnCreativeRejection:
          type:
          - "null"
          - boolean
          description: Notification flag for creative rejection
        notifiedOnEndOfCampaign:
          type:
          - "null"
          - boolean
          description: Notification flag for end of campaign
        notifiedOnNewFeaturesEnabled:
          type:
          - "null"
          - boolean
          description: Notification flag for new features
        servingStatuses:
          type:
          - "null"
          - array
          description: List of serving statuses
          items:
            type: string
        version:
          type:
          - "null"
          - object
          description: Version information
          properties:
            versionTag:
              type:
              - "null"
              - string
      additionalProperties: true

    AccountsList:
      type: object
      description: Paginated list of ad accounts
      properties:
        elements:
          type: array
          items:
            $ref: "#/components/schemas/Account"
        metadata:
          type: object
          properties:
            nextPageToken:
              type: string

    AccountUser:
      type: object
      x-airbyte-entity-name: account_users

      - name
      - runSchedule
      properties:
        account:
          type: string
          description: "Sponsored account URN; must match the account_id path parameter, e.g. urn:li:sponsoredAccount:123456"
        name:
          type: string
          description: Campaign group name
        status:
          type: string
          description: Initial status
          enum: [ACTIVE, DRAFT]
        runSchedule:
          type: object

paths:
  /applications:
    get:
      summary: List applications
      description: Returns a cursor-paginated list of applications.
      operationId: listApplication
      x-airbyte-entity: applications
      x-airbyte-action: list
      x-airbyte-meta-extractor:
        next: '@link.next'
      parameters:
        - name: cursor
          in: query
          required: false
          description: Cursor from the previous response Link header. Do not combine with any other parameter.
          schema:
            type: string
        - name: per_page
          in: query
          required: false
          description: Number of records to return on the first page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
        - name: ids
          in: query
          required: false
          description: Return only records with these IDs (maximum 50).
          schema:
            type: array
            items:
              type: integer
            maxItems: 50
          style: form
          explode: false
        - name: updated_at
          in: query
          required: false
          description: Filter by updated timestamp using the Harvest v3 pipe expression, such as gte|2026-01-01T00:00:00Z.
          schema:
            type: string
      responses:
        '200':
          description: List of applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Application'
        '401':
          description: Unauthorized
        '403':
          description: Missing OAuth scope or authorizing user is not a Site Admin

components:
  securitySchemes:
    mondayOAuth:
      type: oauth2
      description: Monday.com OAuth 2.0 authentication
      flows:
        authorizationCode:
          authorizationUrl: https://auth.monday.com/oauth2/authorize
          tokenUrl: https://auth.monday.com/oauth2/token
          refreshUrl: https://auth.monday.com/oauth2/token
          scopes:
            me:read: Read current user info
            boards:read: Read boards
            workspaces:read: Read workspaces
            users:read: Read users
            account:read: Read account info
            updates:read: Read updates
            assets:read: Read assets
            tags:read: Read tags
            teams:read: Read teams
      x-airbyte-oauth-scopes:
        - scope: "me:read"
          mode: read
          entities: ["users"]
          description: Read the current authenticated user's profile
        - scope: "boards:read"
          mode: read
          entities: ["boards", "items", "activity_logs"]
          description: Read boards, their items, and activity logs
        - scope: "workspaces:read"
          mode: read
          entities: ["workspaces"]
          description: Read workspaces
        - scope: "users:read"
          mode: read
          entities: ["users"]
          description: Read user accounts
        - scope: "account:read"
          mode: read
          entities: ["workspaces"]
          description: Read general account info including workspace account_product
        - scope: "assets:read"
          mode: read
          entities: ["updates", "items"]
          description: Read file assets attached to updates and items
        - scope: "updates:read"
          mode: read
          entities: ["updates"]
          description: Read updates and comments
        - scope: "tags:read"
          mode: read
          entities: ["tags"]
          description: Read tags
        - scope: "teams:read"
          mode: read
          entities: ["teams"]
          description: Read teams
      x-airbyte-auth-config:
        title: OAuth 2.0 Authentication
        type: object
        required:
          - access_token
          - client_id
          - client_secret
        properties:
          access_token:
            type: string
            title: Access Token
            description: Access token obtained via OAuth 2.0 flow
          client_id:
            type: string
            title: Client ID
            description: The Client ID of your Monday.com OAuth application
          client_secret:
            type: string
            title: Client Secret
            description: The Client Secret of your Monday.com OAuth application
        auth_mapping:
          access_token: "${access_token}"
          client_id: "${client_id}"
          client_secret: "${client_secret}"
        additional_headers:
          API-Version: "2026-07"
        replication_auth_key_mapping:
          credentials.access_token: "access_token"
          credentials.client_id: "client_id"
          credentials.client_secret: "client_secret"
        replication_auth_key_constants:
          credentials.auth_type: "oauth2.0"
          credentials.subdomain: ""

    mondayApiToken:
      type: http
      scheme: bearer
      description: Monday.com personal API token authentication
      x-airbyte-auth-config:
        title: API Token Authentication
        type: object
        required:
          - api_key
        properties:
          api_key:
            type: string
            title: API Token
            description: Your Monday.com personal API token
        auth_mapping:
          token: "${api_key}"
        additional_headers:
          API-Version: "2026-07"
        replication_auth_key_mapping:
          credentials.api_token: "api_key"
        replication_auth_key_constants:
          credentials.auth_type: "api_token"

  schemas:
    User:
      type: object
      x-airbyte-entity-name: users
      x-airbyte-stream-name: users
      x-airbyte-ai-hints:
        summary: "Monday.com users with role and team membership"
        when_to_use: "Looking up team members in Monday.com"
        trigger_phrases: ["monday user", "team member"]
        freshness: live
        search_strategy: "Search by name or email"
        example_questions:
          - "Who are the Monday.com users?"
      description: Monday.com user object
      properties:
        id:
          type: ["null", "string"]
          description: Unique user identifier
        name:
          type: ["null", "string"]
          description: User's display name
        email:
          type: ["null", "string"]
          description: User's email address
        birthday:
          type: ["null", "string"]
          description: User's birthday (ISO8601 date string under API 2026-07)
        country_code:
          type: ["null", "string"]
          description: User's country code
        created_at:
          type: ["null", "string"]
          description: When the user was created (ISO8601 datetime under API 2026-07)
        kind:
          type: ["null", "string"]
          description: User kind, e.g. member, admin, guest, view_only. Replaces the legacy is_admin/is_guest/is_view_only booleans removed in API 2026-10.
        status:
          type: ["null", "string"]
          description: User status, e.g. ACTIVE, INACTIVE, PENDING, DISABLED. Replaces the legacy enabled/is_pending booleans removed in API 2026-10.
        is_email_confirmed:
          type: ["null", "boolean"]
          description: Whether the user's email is confirmed. Replaces the legacy is_verified field removed in API 2026-10.
        became_active_at:
          type: ["null", "string"]
          description: When the user became active. Replaces the legacy join_date field removed in API 2026-10.
        location:
          type: ["null", "string"]
          description: User's location
        mobile_phone:
          type: ["null", "string"]
          description: User's mobile phone number
        phone:
          type: ["null", "string"]
          description: User's phone number
        photo_url:
          type: ["null", "object"]
          description: Nested object containing photo URLs at various sizes. Replaces the legacy photo_* scalar fields removed in API 2026-10.
          properties:
            original:
              type: ["null", "string"]
              description: URL to original size photo
            small:
              type: ["null", "string"]
              description: URL to small photo
            thumb:
              type: ["null", "string"]
              description: URL to thumbnail photo
            thumb_small:
              type: ["null", "string"]
              description: URL to small thumbnail photo
            tiny:
              type: ["null", "string"]
              description: URL to tiny photo
        time_zone_identifier:
          type: ["null", "string"]
          description: User's timezone identifier
        title:

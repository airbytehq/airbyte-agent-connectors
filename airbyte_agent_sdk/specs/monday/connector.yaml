openapi: 3.1.0

info:
  title: Monday.com API Connector
  version: 2.0.0
  description: >
    Connector for the Monday.com platform API. Monday.com is a work operating system
    that enables teams to build workflows for project management, CRM, software development,
    and more. This connector provides read access to boards, items, users, teams, tags,
    updates, workspaces, and activity logs via the Monday.com GraphQL API (v2).
  x-airbyte-connector-name: monday
  x-airbyte-connector-definition-id: 80a54ea2-9959-4040-aac1-eee42423ec9b
  x-airbyte-replication-version: "2.5.18"
  x-airbyte-replication-compatibility: ">=2.5.18, <3.0.0"
  x-airbyte-replication-config:
    title: Replication Configuration
    description: Settings for data replication from Monday.com.
    properties: {}
  x-airbyte-external-documentation-urls:
    - type: api_reference
      title: Monday.com API Reference
      url: https://developer.monday.com/api-reference/docs
    - type: authentication_guide
      title: Monday.com Authentication
      url: https://developer.monday.com/api-reference/docs/authentication
    - type: rate_limits
      title: Monday.com Rate Limits
      url: https://developer.monday.com/api-reference/docs/rate-limits

  x-airbyte-example-questions:
    direct:
      - "List all users in the Monday.com account"
      - "Show me all boards"
      - "Get the details of board 18395979459"
      - "List all teams"
      - "Show me all tags"
      - "List recent updates"
    search:
      - "Which boards were updated in the last week?"
      - "Find all items assigned to a specific group"
      - "What are the most active boards by update count?"
      - "Show me all users who are admins"
      - "List items with their column values from a specific board"
    unsupported:
      - "Create a new board"
      - "Delete an item"
      - "Update a column value"
      - "Add a new user to the account"
      - "Create a webhook subscription"

  x-airbyte-entity-relationships:
  - source_entity: items
    target_entity: boards
    foreign_key: board_id
    target_key: id
    cardinality: many_to_one
  - source_entity: activity_logs
    target_entity: boards
    foreign_key: board_id
    target_key: id
    cardinality: many_to_one

  x-airbyte-context-store:
    disable_compaction: true
    entities:
      - entity: activity_logs
        x-airbyte-name: activity_logs
        fields:
          - name: board_id
            type: ["null", "integer"]
            description: Board ID the activity belongs to
          - name: created_at
            type: ["null", "string"]
            description: When the activity occurred
          - name: created_at_int
            type: ["null", "integer"]
            description: When the activity occurred (Unix timestamp)
          - name: data
            type: ["null", "string"]
            description: Event data (JSON string)
          - name: entity
            type: ["null", "string"]
            description: Entity type that was affected
          - name: event
            type: ["null", "string"]
            description: Event type
          - name: id
            type: ["null", "string"]
            description: Unique activity log identifier
          - name: pulse_id
            type: ["null", "integer"]
            description: Item (pulse) ID the activity belongs to
          - name: user_id
            type: ["null", "string"]
            description: ID of the user who performed the action
      - entity: boards
        x-airbyte-name: boards
        suggested: true
        fields:
          - name: board_kind
            type: ["null", "string"]
            description: Board kind (public, private, share)
          - name: columns
            type: ["null", "array"]
            description: Board columns
          - name: communication
            type: ["null", "string"]
            description: Board communication value
          - name: creator
            type: ["null", "object"]
            description: Board creator
            properties:
              id:
                type: ["null", "string"]
          - name: description
            type: ["null", "string"]
            description: >-
              Board description -- the charter a team writes to say what the board is for.
              Semantically searchable. Empty on boards created programmatically.
            x-airbyte-semantic-search:
              content_type: plaintext
              samples:
                # The board name leads: descriptions open mid-thought ("Welcome to your
                # inventory management board...") and the name is what a query actually names.
                - { name: board_name, path: "/name" }
                - name: board_description
                  windowed: true
                  sampling: { sample_type: whole, unit_label: board }
              # whole, not regex: a description that fits inside the cap renders a byte-identical
              # context_text per paragraph unit -- N chunks, one distinct vector.
              windowing: { context_max_chars: 2048, context_boundary: whole_unit }
              embedding:
                model: text-embedding-3-small
                template: "{board_name}\n\n{board_description}"
              # [0] record key, [1] cursor, positionally. workspace_id and board_kind are the
              # scoping filters a "which board covers X" query narrows on, and the metadata set
              # is now-or-never -- adding a column once vectors exist forces a rebuild.
              # workspace_id reads the nested `workspace` struct: _canonical_raw_columns selects
              # the path's FIRST segment, so `workspace` is materialised and the name is just the
              # output key.
              metadata:
                - { name: id, path: "/id", type: string }
                - { name: updated_at, path: "/updated_at", type: string }
                - { name: name, path: "/name", type: string }
                - { name: state, path: "/state", type: string }
                - { name: board_kind, path: "/board_kind", type: string }
                - { name: workspace_id, path: "/workspace.id", type: string }
          - name: groups
            type: ["null", "array"]
            description: Board groups
          - name: id
            type: ["null", "string"]
            description: Unique board identifier
          - name: name
            type: ["null", "string"]
            description: Board name
          - name: owners
            type: ["null", "array"]
            description: Board owners
          - name: permissions
            type: ["null", "string"]
            description: Board permissions
          - name: state
            type: ["null", "string"]
            description: Board state (active, archived, deleted)
          - name: subscribers
            type: ["null", "array"]
            description: Board subscribers
          - name: tags
            type: ["null", "array"]
            description: Board tags
          - name: top_group
            type: ["null", "object"]
            description: Top group on the board
            properties:
              id:
                type: ["null", "string"]
          - name: type
            type: ["null", "string"]
            description: Board type
          - name: updated_at
            type: ["null", "string"]
            description: When the board was last updated
          - name: updated_at_int
            type: ["null", "integer"]
            description: When the board was last updated (Unix timestamp)
          - name: updates
            type: ["null", "array"]
            description: Board updates
          - name: views
            type: ["null", "array"]
            description: Board views
          - name: workspace
            type: ["null", "object"]
            description: Workspace the board belongs to
            properties:
              id:
                type: ["null", "string"]
              name:
                type: ["null", "string"]
              kind:
                type: ["null", "string"]
              description:
                type: ["null", "string"]
      - entity: items
        x-airbyte-name: items
        suggested: true
        fields:
          - name: assets
            type: ["null", "array"]
            description: Files attached to the item
          - name: board
            type: ["null", "object"]
            description: Board the item belongs to
            properties:
              id:
                type: ["null", "string"]
              name:
                type: ["null", "string"]
          - name: column_values
            type: ["null", "array"]
            description: Item column values
          - name: created_at
            type: ["null", "string"]
            description: When the item was created
          - name: creator_id
            type: ["null", "string"]
            description: ID of the user who created the item
          - name: group
            type: ["null", "object"]
            description: Group the item belongs to
            properties:
              id:
                type: ["null", "string"]
          - name: id
            type: ["null", "string"]
            description: Unique item identifier
          - name: name
            type: ["null", "string"]
            description: >-
              Item name -- the task/row title, and the only always-populated human-readable text
              on an item. Semantically searchable, prefixed with its board name.
            x-airbyte-semantic-search:
              content_type: plaintext
              samples:
                # The board name disambiguates titles that repeat across boards ("Task 1",
                # "Design review"). It is read from the nested `board` struct on the item row --
                # no lookup, and no cross-entity join, which does not exist at index time.
                - { name: board_name, path: "/board.name" }
                - name: item_name
                  windowed: true
                  sampling: { sample_type: whole, unit_label: item }
              windowing: { context_max_chars: 2048, context_boundary: whole_unit }
              embedding:
                model: text-embedding-3-small
                template: "{board_name}\n\n{item_name}"
              # [0] record key, [1] cursor, positionally. board_id and group_id are the two
              # dimensions a scoped query narrows on and are otherwise unreachable -- an outer
              # WHERE over semantic_search(...) runs after the inner top-k, so a dimension left
              # out here cannot be recovered by joining the raw table.
              metadata:
                - { name: id, path: "/id", type: string }
                - { name: updated_at, path: "/updated_at", type: string }
                # `name` is the windowed column, so without this declaration a hit would carry the
                # item's ids and state but not its title -- readable only by parsing it back out of
                # `context`. Declaring it as record-root metadata puts it in the `entity` block on
                # the REST semantic path and keeps it in `entity_data` on the workspace-search path
                # (which preserves embedded columns that are also record-root metadata).
                - { name: name, path: "/name", type: string }
                - { name: created_at, path: "/created_at", type: string }
                - { name: creator_id, path: "/creator_id", type: string }
                - { name: state, path: "/state", type: string }
                - { name: board_id, path: "/board.id", type: string }
                - { name: group_id, path: "/group.id", type: string }
          - name: parent_item
            type: ["null", "object"]
            description: Parent item (for subitems)
            properties:
              id:
                type: ["null", "string"]
          - name: state
            type: ["null", "string"]
            description: Item state (active, archived, deleted)
          - name: subscribers
            type: ["null", "array"]
            description: Item subscribers
          - name: updated_at
            type: ["null", "string"]
            description: When the item was last updated
          - name: updated_at_int
            type: ["null", "integer"]
            description: When the item was last updated (Unix timestamp)
          - name: updates
            type: ["null", "array"]
            description: Item updates
      - entity: tags
        x-airbyte-name: tags
        suggested: true
        fields:
          - name: color
            type: ["null", "string"]
            description: Tag color
          - name: id
            type: ["null", "string"]
            description: Unique tag identifier
          - name: name
            type: ["null", "string"]
            description: Tag name
      - entity: teams
        x-airbyte-name: teams
        suggested: true
        fields:
          - name: id
            type: ["null", "integer"]
            description: Unique team identifier
          - name: name
            type: ["null", "string"]
            description: Team name
          - name: picture_url
            type: ["null", "string"]
            description: Team picture URL
          - name: users
            type: ["null", "array"]
            description: Team members
      - entity: updates
        x-airbyte-name: updates
        suggested: true
        fields:
          - name: assets
            type: ["null", "array"]
            description: Files attached to this update
          - name: body
            type: ["null", "string"]
            description: >-
              Update body as HTML. Not semantically indexed -- the embedding engine has no
              HTML decoder. Use text_body for search; this field is for rendering only.
          - name: created_at
            type: ["null", "string"]
            description: When the update was created
          - name: creator_id
            type: ["null", "string"]
            description: ID of the user who created the update
          - name: id
            type: ["null", "string"]
            description: Unique update identifier
          - name: item_id
            type: ["null", "string"]
            description: ID of the item this update belongs to
          - name: replies
            type: ["null", "array"]
            description: >-
              Replies to this update -- the threaded discussion beneath it, where the substance
              of a Monday conversation usually lives. Each reply's plain text is semantically
              indexed as its own unit; the parent update's text is appended as context.
            x-airbyte-semantic-search:
              # content_type json, not plaintext: the value is an array of reply objects, and
              # plaintext over a list resolves to zero chunks SILENTLY rather than failing.
              content_type: json
              samples:
                # The parent update's text, read straight off the same row. Slack needs a
                # same-stream self-join for this because its replies are sibling rows; Monday
                # nests replies under their parent, so a plain record-root scalar reaches it.
                - { name: parent_body, path: "/text_body" }
                # element with sample_path "[]": one unit per reply, mirroring gong's
                # speaker_turn. The "[]" is what enters the array -- text_path "text_body"
                # without it resolves to zero chunks silently, as does a missing sample_path
                # (that one at least fails schema validation).
                - name: reply_body
                  windowed: true
                  sampling: { sample_type: element, unit_label: reply, sample_path: "[]", text_path: "text_body" }
              # context_max_chars 0 -- "embed the unit only" -- and NOT the house 2048.
              # _context_window_around centres a window on each unit within the JOINED document,
              # so at 2048 every reply in a thread that fits under the cap renders a
              # byte-identical context_text: measured 3 replies -> 3 chunks / 1 distinct vector,
              # 12 -> 12 / 1. That is the same duplicate-vector failure that disqualified regex
              # for text_body. gong survives element-at-2048 only because call transcripts are
              # long enough to force divergent windows; Monday replies are short. The cost of 0
              # is that a reply over 2048 chars is emitted whole and silently truncated by
              # MotherDuck's embedding() instead of sliding into sub-windows.
              windowing: { context_max_chars: 0, context_boundary: whole_unit }
              embedding:
                model: text-embedding-3-small
                # The reply LEADS and the parent TRAILS, matching Slack's threads annotation: a
                # search hit's context is front-truncated at 200 chars, and with the parent
                # leading, Slack measured 816 of 929 replies returning a context that showed only
                # the parent. The label keeps the parent from reading as part of the reply.
                # It renders unconditionally -- an image-only parent (text_body "") yields a
                # dangling "\n\nIn reply to: ". Conditional sample prefixes are not in the schema
                # on this branch.
                template: "{reply_body}\n\nIn reply to: {parent_body}"
              # [0] is the record key and [1] the cursor, positionally -- both the parent
              # update's, since a reply has no independent identity in the raw table. All chunks
              # of one update therefore share a record key; that is safe because the incremental
              # delta swaps a record's chunks wholesale (DELETE by key + INSERT), so a newly
              # added reply is picked up.
              #
              # item_id and creator_id are mandatory here, not optional context: the entity-level
              # x-airbyte-enrichment below is resolved per ENTITY, not per field, so it applies to
              # this field too and its join renders those columns against the ranked subquery.
              # For the same reason a reply-author enrichment cannot be added -- it would render a
              # column text_body's metadata does not project. reply_author is reachable at read
              # time by following reply_creator_id.
              #
              # The trailing three are unit-relative (no leading "/"): they resolve against the
              # matched reply and land in the hit's metadata block, which is the ONLY way a caller
              # can tell which reply matched. Same shape as gong's speakerId.
              metadata:
                - { name: id, path: "/id", type: string }
                - { name: updated_at, path: "/updated_at", type: string }
                - { name: created_at, path: "/created_at", type: string }
                - { name: item_id, path: "/item_id", type: string }
                - { name: creator_id, path: "/creator_id", type: string }
                - { name: reply_id, path: "id", type: string }
                - { name: reply_creator_id, path: "creator_id", type: string }
                - { name: reply_created_at, path: "created_at", type: string }
          - name: text_body
            type: ["null", "string"]
            description: >-
              Update body as plain text -- the human comment posted on a Monday item.
              Semantically searchable. Empty for image-only updates, which therefore
              produce no embedding.
            x-airbyte-semantic-search:
              # text_body, not body: body is HTML and semantic_chunking._decode raises
              # NotImplementedError for content_type html at embedding-job runtime (it passes
              # YAML validation, then fails every sync). text_body is source-monday's
              # plaintext twin of the same content, replicated on the same stream.
              content_type: plaintext
              samples:
                # whole, not a regex paragraph split: the engine centres a full
                # context_max_chars window on EVERY unit, so a record that fits inside the
                # budget renders a byte-identical context_text per paragraph. No committed
                # cassette update contains a blank-line break, so the two samplers are
                # indistinguishable on the fixtures (24 chunks / 24 distinct either way);
                # on a synthetic multi-paragraph corpus regex gives 23 chunks / 5 distinct
                # texts against whole's 5 / 5. A body over the cap is not truncated -- whole
                # slides it into overlapping sub-windows.
                - name: update_body
                  windowed: true
                  sampling: { sample_type: whole, unit_label: update_body }
              # 2048 is a platform ceiling, not a tuning choice: MotherDuck's embedding()
              # silently truncates input at 2048 characters, so a higher cap would return a
              # context containing text that was never embedded.
              windowing: { context_max_chars: 2048, context_boundary: whole_unit }
              embedding: { model: text-embedding-3-small }
              # Order is load-bearing: the first record-root ('/') entry is the record key and
              # the second is the cursor, taken positionally, and both names are resolved as
              # physical raw-table columns. source-monday's updates stream is full-refresh
              # with no declared cursor, so updated_at here is the sole supplier of the Athena
              # dedupe ORDER BY.
              #
              # These names become physical embeddings-table columns, so the set is
              # now-or-never: adding one after vectors exist forces a table rebuild. item_id
              # and creator_id are here for two reasons -- they are exact filters (better than
              # fuzzy-matching digits in the vector, which would spend 27-55% of a median
              # update's embedded text on opaque ids), and each is the local match column of
              # an x-airbyte-enrichment below, which renders as a column on the ranked
              # subquery and therefore must be projected.
              metadata:
                - { name: id, path: "/id", type: string }
                - { name: updated_at, path: "/updated_at", type: string }
                - { name: created_at, path: "/created_at", type: string }
                - { name: item_id, path: "/item_id", type: string }
                - { name: creator_id, path: "/creator_id", type: string }
          - name: updated_at
            type: ["null", "string"]
            description: When the update was last modified
        # Read-time only. The metadata entries above do reach the agent -- they land in a search
        # hit's `entity` block -- but they are opaque integers, and an update carries no item
        # name, no author name, and no constructible permalink. These projections make a hit
        # readable ("which item? who wrote it?") without changing what it matches on.
        #
        # Availability is asymmetric. Workspace search fails soft: a denied or unresolvable
        # target is dropped and the hit is unchanged. A semantic_search(...) call inside
        # context_store_sql_query fails soft too unless it opts in with enrich => true (default
        # false), in which case it is rejected outright while ANY declared target's native
        # table is not yet ready. Both targets are suggested: true and small, so they land
        # alongside updates; zendesk-support.ticket_comments carries the same two-target shape.
        x-airbyte-enrichment:
          - target: items
            match:
              - { local: "/item_id", foreign: id }
            project:
              - { name: itemName, from: name }
          - target: users
            match:
              - { local: "/creator_id", foreign: id }
            project:
              - { name: authorName, from: name }
      - entity: users
        x-airbyte-name: users
        suggested: true
        # NOTE: This cache entity is validated against the upstream source-monday manifest
        # in airbytehq/airbyte, which still targets API 2026-01 and has not yet migrated
        # to the 2026-07 User shape. The new 2026-07 fields (became_active_at,
        # is_email_confirmed, kind, photo_url, status) are intentionally excluded here
        # until source-monday ships equivalent replication support; at that point they
        # should be added back so the semantic cache can populate them.
        fields:
          - name: birthday
            type: ["null", "string"]
            description: User's birthday
          - name: country_code
            type: ["null", "string"]
            description: User's country code
          - name: created_at
            type: ["null", "string"]
            description: When the user was created
          - name: email
            type: ["null", "string"]
            description: User's email address
          - name: id
            type: ["null", "string"]
            description: Unique user identifier
          - name: location
            type: ["null", "string"]
            description: User's location
          - name: mobile_phone
            type: ["null", "string"]
            description: User's mobile phone number
          - name: name
            type: ["null", "string"]
            description: User's display name
          - name: phone
            type: ["null", "string"]
            description: User's phone number
          - name: time_zone_identifier
            type: ["null", "string"]
            description: User's timezone identifier
          - name: title
            type: ["null", "string"]
            description: User's job title
          - name: url
            type: ["null", "string"]
            description: User's Monday.com profile URL
          - name: utc_hours_diff
            type: ["null", "number"]
            description: UTC hours difference for the user's timezone (Float under API 2026-07)
      - entity: workspaces
        x-airbyte-name: workspaces
        suggested: true
        fields:
          - name: account_product
            type: ["null", "object"]
            description: Account product info
            properties:
              id:
                type: ["null", "string"]
              kind:
                type: ["null", "string"]
          - name: created_at
            type: ["null", "string"]
            description: When the workspace was created
          - name: description
            type: ["null", "string"]
            description: Workspace description
          - name: id
            type: ["null", "string"]
            description: Unique workspace identifier
          - name: kind
            type: ["null", "string"]
            description: Workspace kind (open, closed)
          - name: name
            type: ["null", "string"]
            description: Workspace name
          - name: owners_subscribers
            type: ["null", "array"]
            description: Owner subscribers
          - name: settings
            type: ["null", "object"]
            description: Workspace settings
            properties:
              icon:
                type: ["null", "object"]
                properties:
                  color:
                    type: ["null", "string"]
                  image:
                    type: ["null", "string"]
          - name: state
            type: ["null", "string"]
            description: Workspace state
          - name: team_owners_subscribers
            type: ["null", "array"]
            description: Team owner subscribers
          - name: teams_subscribers
            type: ["null", "array"]
            description: Team subscribers
          - name: users_subscribers
            type: ["null", "array"]
            description: User subscribers

servers:
  - url: https://api.monday.com
    description: Monday.com API server

security:
  - mondayOAuth: []
  - mondayApiToken: []

paths:
  /graphql:users:list:
    post:
      summary: List users
      description: Returns all users in the Monday.com account
      operationId: listUsers
      x-airbyte-entity: users
      x-airbyte-action: list
      x-airbyte-record-extractor: $.data.users
      x-airbyte-preferred-for-check: true
      x-airbyte-no-pagination: "Monday.com GraphQL users() field accepts page/limit variables but the response exposes no next-page cursor or total count; pagination termination is derived client-side from page-size exhaustion. limit is pinned at the API 2026-07 maximum (1000) per page."
      x-airbyte-path-override:
        path: /v2
      parameters:
        - name: page
          in: query
          description: Page number for pagination
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Number of users to return per page (API 2026-07 maximum is 1000)
          schema:
            type: integer
            default: 1000
      requestBody:
        x-airbyte-body-type:
          type: graphql
          query: |
            query($page: Int, $limit: Int) {
              users(page: $page, limit: $limit) {
                id
                name
                email
                birthday
                country_code
                created_at
                kind
                status
                is_email_confirmed
                became_active_at
                location
                mobile_phone
                phone
                photo_url {
                  original
                  small
                  thumb
                  thumb_small
                  tiny
                }
                time_zone_identifier
                title
                url
                utc_hours_diff
              }
            }
          variables:
            page: "{{ page }}"
            limit: "{{ limit }}"
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      users:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

  /graphql:users:get:
    post:
      summary: Get a user
      description: Returns a single user by ID
      operationId: getUser
      x-airbyte-entity: users
      x-airbyte-action: get
      x-airbyte-record-extractor: $.data.users[0]
      x-airbyte-path-override:
        path: /v2
      parameters:
        - name: id
          in: query
          required: true
          description: User ID
          schema:
            type: string
      requestBody:
        x-airbyte-body-type:
          type: graphql
          query: |
            query($ids: [ID!]) {
              users(ids: $ids) {
                id
                name
                email
                birthday
                country_code
                created_at
                kind
